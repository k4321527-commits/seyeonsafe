<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(주)세연이앤에스 교육센터 - 로그인</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="./login.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../common/supabase.js"></script>
</head>
<body style="background-color: #fff;">

    <!-- ==================== 헤더 영역 ==================== -->
    <header style="background-color: #fff; border-bottom: 1px solid #eaeaea;">
        <div class="top-ribbon">
            <div class="inner ribbon-wrap">
                <div class="ribbon-left"></div>
                <div class="ribbon-right">
                    <span style="font-weight: 700; color: #0056b3;">(주)세연이앤에스 교육센터</span>
                </div>
            </div>
        </div>

        <div class="inner header-main">
            <div class="header-logo-group">
                <a href="../../index.html" class="logo">
                    <span class="logo-text">(주)세연이앤에스 </span>
                </a>
            </div>
            
            <div class="header-utils-gov" id="headerUtils">
                <a href="./login.html" style="color:var(--secondary-color);"><i class="fa-solid fa-right-to-bracket"></i> 로그인</a>
                <a href="../sign/sign.html"><i class="fa-solid fa-user-plus"></i> 회원가입</a>
            </div>
        </div>

        <div class="header-gnb">
            <div class="inner">
                <ul class="gnb-menu">
                    <li><a href="../course/safe.html">안전보건교육</a></li>
                    <li><a href="../course/law.html">법정필수교육</a></li>
                    <li><a href="../mypage/mypage.html?tab=apply">수강신청하기</a></li>
                    <li><a href="../mypage/mypage.html">나의 강의실</a></li>
                </ul>
            </div>
        </div>
    </header>

    <!-- ==================== 로그인 폼 영역 ==================== -->
    <main class="login-page-wrap">
        <div class="inner" style="width: 100%;">
            <div class="login-wrap" style="max-width: 480px; margin: 0 auto;">
                
                <h2 style="font-size: 24px; font-weight: 800; color: #111; margin-bottom: 20px;">로그인</h2>

                <div class="login-box-container">
                    
                    <div class="login-header">
                        <div class="company-logo-wrap">
                            <div style="width: 48px; height: 48px; background-color: #f1f5f9; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #8fa0b3; font-size: 20px;">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                        </div>
                        <h2 style="font-size: 26px; font-weight: 900; color: #8fa0b3; letter-spacing: 1px; font-family: 'Arial', sans-serif; margin: 0;">LOGIN</h2>
                    </div>

                    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
                        
                        <!-- 입력창 영역 -->
                        <div class="input-group">
                            <input type="text" id="userId" placeholder="아이디" required autocomplete="off">
                            <input type="password" id="userPw" placeholder="비밀번호" required>
                        </div>

                        <!-- 하단 유틸리티 메뉴 -->
                        <div class="login-utils">
                            <label class="save-id">
                                <input type="checkbox"> 아이디 저장
                            </label>
                            <div class="find-links">
                                <a onclick="openModal('idModal')">아이디 찾기</a>
                                <span class="divider">|</span>
                                <a onclick="alert('비밀번호 확인은 관리자(062-511-7741)에게 문의해 주세요.')">비밀번호 찾기</a>
                                <span class="divider">|</span>
                                <a href="../sign/sign.html">회원가입</a>
                            </div>
                        </div>

                        <button type="submit" class="btn-login-submit">로그인</button>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <!-- ==================== 아이디 찾기 모달창 (휴대폰 3칸 & 생년월일 8자리 적용) ==================== -->
    <div id="idModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>아이디 찾기</h3>
                <button class="close-btn" onclick="closeModal('idModal')">&times;</button>
            </div>
            
            <div class="form-row">
                <label>이름</label>
                <input type="text" id="findIdName" placeholder="가입 시 등록한 이름">
            </div>
            
            <div class="form-row">
                <label>생년월일 (8자리)</label>
                <input type="text" id="findIdBirth" maxlength="8" placeholder="예: 19960703" oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            </div>
            
            <div class="form-row">
                <label>휴대폰 번호</label>
                <div class="inline-group" style="display: flex; align-items: center; gap: 10px;">
                    <input type="text" id="findIdPhone1" placeholder="010" maxlength="3" oninput="this.value = this.value.replace(/[^0-9]/g, '');" style="text-align: center;">
                    <span style="color: #94a3b8;">-</span>
                    <input type="text" id="findIdPhone2" placeholder="0000" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '');" style="text-align: center;">
                    <span style="color: #94a3b8;">-</span>
                    <input type="text" id="findIdPhone3" placeholder="0000" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '');" style="text-align: center;">
                </div>
            </div>

            <button class="btn-modal" onclick="findMyId()">아이디 확인</button>
            <div id="idResultBox" class="result-box"></div>
        </div>
    </div>

   <script>
    // 로그인 처리
    async function handleLogin() {
        const userId = document.getElementById('userId').value.trim();
        const userPw = document.getElementById('userPw').value.trim();

        if (!userId || !userPw) {
            alert("아이디와 비밀번호를 입력해주세요.");
            return;
        }

        const dummyEmail = userId + '@lms.com';
        const { data, error } = await window.supabase.auth.signInWithPassword({
            email: dummyEmail,
            password: userPw
        });

        if (error) {
            alert("로그인 실패: 아이디 또는 비밀번호를 확인해주세요.");
            return;
        }

        const userName = data.user.user_metadata?.name || userId;
        localStorage.setItem('userName', userName);
        localStorage.setItem('userRole', userId === 'admin' ? 'admin' : 'user');

        alert(userName + "님 환영합니다!");
        location.href = '../../index.html';
    }

    // 모달창 켜기/끄기 제어
    function openModal(modalId) {
        document.getElementById(modalId).classList.add('active');
    }
    
    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
        const inputs = document.querySelectorAll(`#${modalId} input`);
        inputs.forEach(input => input.value = '');
        
        if(modalId === 'idModal') {
            document.getElementById('idResultBox').style.display = 'none';
        }
    }

    // 아이디 찾기 DB 조회 (이름, 생년월일 8자리, 조합된 휴대폰 번호 대조)
    async function findMyId() {
        const name = document.getElementById('findIdName').value.trim();
        const birth = document.getElementById('findIdBirth').value.trim();
        
        const p1 = document.getElementById('findIdPhone1').value.trim();
        const p2 = document.getElementById('findIdPhone2').value.trim();
        const p3 = document.getElementById('findIdPhone3').value.trim();
        
        if(!name || !birth || !p1 || !p2 || !p3) { 
            alert("이름, 생년월일, 휴대폰 번호를 모두 입력해 주세요."); 
            return; 
        }

        if(birth.length !== 8) {
            alert("생년월일 8자리를 올바르게 입력해 주세요. (예: 19960703)");
            return;
        }

        // 💡 관리자 등록 페이지와 동일한 형식(010-0000-0000)으로 조합
        const fullPhone = `${p1}-${p2}-${p3}`;

        const { data, error } = await window.supabase
            .from('users')
            .select('user_id')
            .eq('name', name)
            .eq('birth', birth)
            .eq('phone', fullPhone);

        const resultBox = document.getElementById('idResultBox');
        if (data && data.length > 0) {
            resultBox.style.color = '#0d4a96';
            resultBox.innerText = `고객님의 아이디는 [ ${data[0].user_id} ] 입니다.`;
        } else {
            resultBox.style.color = '#e11d48';
            resultBox.innerText = "일치하는 회원 정보가 없습니다.";
        }
        resultBox.style.display = 'block';
    }
</script>
</body>
</html>
