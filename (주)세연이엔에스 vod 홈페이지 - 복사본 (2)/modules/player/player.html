    <link rel="stylesheet" href="./player.css">

<body>
    <header class="player-header">
        <div class="header-left">
            <i class="fa-solid fa-graduation-cap"></i> <span id="courseTitleDisplay">강의 로딩 중...</span>
        </div>
        <div class="header-right">
            <span class="progress-label">전체 진행률</span> <span class="progress-percent" id="totalProgressText">0%</span>
        </div>
    </header>

    <div class="player-body">
        <div class="video-section">
            <div class="video-wrapper">
                <video id="videoPlayer" controls autoplay>
                    <source id="videoSource" src="" type="video/mp4">
                    브라우저가 비디오 태그를 지원하지 않습니다.
                </video>
            </div>
            
            <div class="video-controls">
                <div class="control-left">
                    <span class="label"><i class="fa-solid fa-chart-line"></i> 차시 진도율</span>
                    <span class="percent" id="lessonProgressText">0.0%</span>
                    <div class="progress-bar"><div class="fill" id="lessonProgressBar"></div></div>
                </div>
                
                <div class="control-center">
                    <button class="btn-nav" onclick="moveChapter(-1)">이전</button>
                    <span class="page-indicator" id="pageIndicator">01 / 04</span>
                    <button class="btn-nav blue" onclick="moveChapter(1)">다음</button>
                </div>
                
                <div class="control-right"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-list"></i> 강의 목차 ( <span id="currentLessonNum">1</span> / <span id="totalLessonCount">0</span> 차시 )
            </div>
            <div class="chapter-list" id="chapterListContainer"></div>
        </div>
    </div>

    <script src="./player.js" defer></script>
</body>
