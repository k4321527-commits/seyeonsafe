<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 안전관리 교육센터 - 나의 강의실</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="./mypage.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../common/supabase.js"></script>
</head>
<body>

    <!-- ==================== 헤더 영역 ==================== -->
    <header style="background-color: #fff;">
        <div class="top-ribbon">
            <div class="inner ribbon-wrap">
                <div class="ribbon-left"></div>
                <div class="ribbon-right"><span style="font-weight: 700; color: #0056b3;">(주)세연이앤에스 교육센터</span></div>
            </div>
        </div>
        <div class="inner header-main">
            <div class="header-logo-group">
                <a href="../../index.html" class="logo"><span class="logo-text">(주)세연이앤에스</span></a>
            </div>
            <div class="header-utils-gov">
                <span style="color: #111; font-weight: 700;"><i class="fa-solid fa-circle-user" style="color:#0d4a96;"></i> <span id="headerUserName">사용자</span>님</span>
                <a href="../../index.html" style="margin-left: 15px; color: #475569; text-decoration: none;"><i class="fa-solid fa-house"></i> 홈으로</a>
                <a href="#" onclick="handleLogout(event)" style="margin-left: 15px; color: #475569; text-decoration: none;"><i class="fa-solid fa-arrow-right-from-bracket"></i> 로그아웃</a>
            </div>
        </div>
    </header>

    <!-- ==================== 마이페이지 메인 ==================== -->
    <main class="inner mypage-container">
        
        <aside class="mypage-sidebar">
            <h3>나의 강의실</h3>
            <ul class="mypage-menu">
                <li><a onclick="switchTab('apply', this)"><i class="fa-solid fa-cart-plus"></i> 수강신청하기</a></li>
                <li><a class="active" onclick="switchTab('learning', this)"><i class="fa-solid fa-book-open-reader"></i> 수강 중인 강의</a></li>
                <li><a onclick="switchTab('completed', this)"><i class="fa-solid fa-medal"></i> 수강 완료 강의</a></li>
            </ul>
        </aside>

        <div class="mypage-content">

            <!-- ================= 1. 수강신청하기 탭 (동적 렌더링 영역) ================= -->
            <div id="tab-apply" class="tab-pane">
                <div class="section-header">
                    <h2>수강신청하기</h2>
                </div>
                
                <div class="inner-tabs">
                    <button class="active" onclick="switchApplyTab('apply-safe', this)">안전보건교육</button>
                    <button onclick="switchApplyTab('apply-law', this)">법정필수교육</button>
                </div>

                <!-- [A] 안전보건교육 리스트 (DB 동적 연동) -->
                <div id="apply-safe" class="apply-pane" style="display: block;">
                    <table class="course-table">
                        <thead>
                            <tr>
                                <th>분류</th>
                                <th class="text-left">과정명</th>
                                <th style="width: 120px;">신청</th>
                            </tr>
                        </thead>
                        <tbody id="safeCourseTableBody">
                            <!-- mypage.js가 안전보건 강좌들을 동적으로 채워줍니다 -->
                        </tbody>
                    </table>
                </div>

                <!-- [B] 법정필수교육 리스트 (DB 동적 연동) -->
                <div id="apply-law" class="apply-pane" style="display: none;">
                    <table class="course-table">
                        <thead>
                            <tr>
                                <th>분류</th>
                                <th class="text-left">과정명</th>
                                <th style="width: 120px;">신청</th>
                            </tr>
                        </thead>
                        <tbody id="lawCourseTableBody">
                            <!-- mypage.js가 법정필수 강좌들을 동적으로 채워줍니다 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ================= 2. 수강 중인 강의 탭 (DB 렌더링 영역) ================= -->
            <div id="tab-learning" class="tab-pane active">
                <!-- mypage.js가 DB 데이터를 가져와서 여기에 그려줍니다. -->
            </div>

            <!-- ================= 3. 수강 완료 강의 탭 (DB 렌더링 영역) ================= -->
            <div id="tab-completed" class="tab-pane">
                <!-- mypage.js가 DB 데이터를 가져와서 여기에 그려줍니다. -->
            </div> 
            
        </div>
    </main>

    <script src="./mypage.js"></script>
</body>
</html>
